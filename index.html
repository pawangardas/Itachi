<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India AQI Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>India AQI Monitor</h1>
        <p>Track current AQI across India and quickly understand national air quality health.</p>
      </header>

      <section class="token-row">
        <label for="tokenInput">WAQI API Token</label>
        <input id="tokenInput" type="password" placeholder="Enter your token" />
        <button id="saveTokenBtn">Save Token</button>
      </section>

      <section class="summary-grid">
        <article>
          <h2>Average AQI</h2>
          <p id="avgAqi">--</p>
        </article>
        <article>
          <h2>Worst AQI</h2>
          <p id="worstAqi">--</p>
        </article>
        <article>
          <h2>Overall Status</h2>
          <p id="overallStatus">--</p>
        </article>
      </section>

      <section>
        <div class="table-header">
          <h2>Locations</h2>
          <button id="refreshBtn">Refresh</button>
        </div>
        <p id="message"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Location</th>
                <th>AQI</th>
                <th>Category</th>
              </tr>
            </thead>
            <tbody id="aqiTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
